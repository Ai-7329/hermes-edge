# hermes-edge profile — long-running agent on a low-spec shared box.
#
# Target shape: one OpenAI-compatible local server (llama.cpp / llama-server)
# on the same machine, prefill tens of tok/s, decode 15-30 tok/s, hybrid or
# SWA attention (prefix cache restores from checkpoints only), and the box is
# ALSO doing other work — the agent must be a polite tenant, not a landlord.
#
# Copy into ~/.hermes/profiles/<name>/config.yaml and adjust the placeholders
# marked CHANGEME. Pair with scripts/llama-server-edge.sh (or .bat) so the
# server side carries its half of the contract.

model:
  default: "CHANGEME-model-alias"      # must match llama-server --alias exactly
  provider: "custom"
  base_url: "http://127.0.0.1:8080/v1" # /v1 required
  api_key: "not-needed"                # match --api-key if you set one
  context_length: 131072               # MUST equal the server's PER-SLOT window.
                                       # Under the stability design (R1) the
                                       # server runs --parallel 1, so the per-slot
                                       # window IS --ctx-size: the launch script
                                       # uses --ctx-size 131072. The working set
                                       # is bounded well below this by compression
                                       # (R2), so this is headroom for reasoning
                                       # bursts, not the steady-state size.

# cache_key requests slot binding on builds that honor it (llama-cpp-turboquant;
# others ignore it). It is now BELT-AND-SUSPENDERS only: stability requirement R1
# holds by TOPOLOGY — the launch script runs --parallel 1, so the main
# conversation owns the only slot and cannot be evicted regardless of whether the
# pin is honored. The observed build never bound a slot `by cache_key` (only
# `by LRU`/`by LCP`), which is exactly why correctness must not depend on it.
custom_providers:
  - name: "local-llama"
    base_url: "http://127.0.0.1:8080/v1"
    extra_body:
      cache_key: "hermes-main"

# ── The four failure modes this profile closes ─────────────────────────
#
# 1. Fixed header re-prefilled every turn  -> trim toolsets (the real
#    lever: measured 14.9K -> ~5K tokens; +session_search/+delegation add
#    ~2 schemas, still far below the untrimmed header) + bound context files;
#    slot pinning + server cache flags keep the prefix warm.
#
# 2. Auxiliary calls dying at 30s          -> single_flight gate + prefill-
#    aware floors; deferrable features skip instead of queueing.
# 3. Aux traffic evicting main cache       -> EXCLUSIVE TENANCY (R1): --parallel 1
#    so nothing shares the main slot; keep every aux LLM call off this endpoint
#    (mechanical engine issues none) or on a separate server (auxiliary.* below).
# 4. Tool output flooding history          -> tool_output caps (a 50KB cap
#    is ~16K tokens = ~5 min of prefill at 50 tok/s; 6KB is ~35s).
#
# ── Long-run stability (docs/edge/audit/EdgeStability.lean) ─────────────
# Per-turn prefill cost is bounded by a CONSTANT (not the growing context) iff
# three requirements hold together — proven, not tuned:
#   R1 exclusive tenancy  -> --parallel 1 + no aux on the main endpoint
#                            (two_slots_thrash: --parallel 2 alone is unstable)
#   R2 bounded window     -> compression.budget_tokens set (per_turn_cost_le_budget)
#   R3 archive present    -> session_search + mechanical engine, so R2 relocates
#                            information instead of deleting it (archive_preserves_accessible)
# Drop any one and the design degrades to the observed failure: a 93K window,
# ~29-min re-prefills on eviction, 7.57 tok/s decode.

local_runtime:
  single_flight: true        # one in-flight request per local endpoint
  prefill_tps: 50            # CHANGEME: measured prompt-processing tok/s
  decode_budget: 900         # max expected generation seconds per call
  timeout_margin: 30
  gate_wait_timeout: 900     # main conversation: max wait for the gate
  busy_skip_wait: 15         # deferrable aux: give up quickly, skip HTTP
  compression_warmup: true   # re-prefill compacted prompt in idle time

context:
  engine: mechanical         # LLM-free compaction (no summary call at all)

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_first_n: 3
  protect_last_n: 20
  # STABILITY REQUIREMENT R2 — BOUNDED WINDOW (docs/edge/audit/EdgeStability.lean,
  # per_turn_cost_le_budget). budget_tokens caps the RESIDENT window: compaction
  # fires at budget_tokens x threshold, so the worst-case re-prefill is a CONSTANT
  # independent of session length. Without it the window rides to the provider
  # limit and every checkpoint miss is O(context) — the observed 93,551-token /
  # ~29-min re-prefill and 7.57 tok/s decode. 32768 -> 16,384-token trigger,
  # worst miss ~5.5 min at 50 tok/s; and because R1 (exclusive tenancy) keeps
  # checkpoints alive, warm turns re-prefill only the delta, not this bound.
  #
  # This is NOT the "cap reasoning" trade rejected earlier: that objection holds
  # only when compaction DELETES (delete_loses_information). Here R3 makes it a
  # relocation — mechanical engine keeps user turns + tool index verbatim in the
  # window, and session_search keeps the rest retrievable, so accessible
  # information is invariant under compaction (archive_preserves_accessible).
  # Raise toward 65536 (~11-min worst miss) only if you want a wider working set
  # and can absorb the longer cold/miss prefill.
  budget_tokens: 32768

agent:
  max_turns: 150
  api_max_retries: 1         # a timeout retry re-sends the full prompt
  reasoning_effort: medium

tool_output:
  max_bytes: 6000            # ~2K tokens ≈ 35-40s of prefill per tool call
  max_lines: 300
  max_line_length: 2000

# tool_search defers MCP/PLUGIN tools only — builtin toolset schemas are
# never deferred (core tools by design). Header size is therefore governed
# by the toolset list below, verified live: 5 toolsets ≈ 14.9K-token
# header, the 3 below ≈ 5K. Add toolsets only when a workflow needs them.
tools:
  tool_search: { enabled: "auto" }

platform_toolsets:
  cli:
    - terminal
    - file
    - todo
    # Distributed-context tier (demote, don't delete). These two add ~2 tool
    # schemas to the header (small vs. a full toolset) and in return make the
    # "bound resident tokens, not accessible information" design actually run:
    - session_search   # COLD tier: recall compacted/past detail on demand via
                       #   FTS5 session search — dropped turns stay retrievable
                       #   instead of gone, so a bounded window costs less reasoning.
                       #   NOTE: pull, not push — the model must choose to search.
    - delegation       # HORIZONTAL spread: delegate_task spawns subagents with
                       #   isolated windows, so one large task doesn't have to
                       #   ride in a single window. single_flight serialises them
                       #   on a one-box backend, but each subagent prefill stays bounded.

# Workspace context files (AGENTS.md etc.) inject into the header from the
# agent's cwd — a 70KB AGENTS.md is ~8K tokens of header on every turn
# (observed live). Bound it; run the agent from its real work directory.
context_file_max_chars: 4000

auxiliary:
  # Deferrable features skip when the server is busy (gate) — but on a
  # one-server box the honest configuration is to disable what you don't
  # use and give the rest realistic deadlines.
  title_generation:
    enabled: false           # edge fork switch; upstream had no off switch
  compression:
    provider: main
    timeout: 600             # floor also applies via local_runtime.prefill_tps
  # To offload aux work entirely, run a second small-model server and point
  # features at it (per-feature provider/model/base_url are honored):
  #   flush_memories:
  #     provider: custom
  #     base_url: "http://127.0.0.1:8081/v1"
  #     model: "CHANGEME-small-alias"
  #     timeout: 120

memory:
  memory_enabled: true
  nudge_interval: 0          # no periodic memory-review nudges
  flush_min_turns: 0

curator:
  enabled: false             # weekly LLM curation pass — off on shared boxes

approvals:
  mode: manual
  timeout: 60                # unattended timeout reports deny_timeout (fork fix)

display:
  streaming: true
  show_reasoning: true

sessions:
  auto_prune: true           # long-running boxes: keep the session DB bounded
  retention_days: 90

# ── Airgap / offline (factory edge boxes) ───────────────────────────────
# Every switch below cuts an outbound network surface that would otherwise
# fire (or wait out a connection timeout) on an offline box. Each is
# consumed by real code, not aspirational: model_catalog gate at
# hermes_cli/model_catalog.py get_catalog(), lsp gate at
# agent/lsp/manager.py, tirith in the security config, startup update
# check at hermes_cli/main.py (edge fork switch). The trimmed
# platform_toolsets above already exclude web/browser/tts/vision tools;
# install the CORE package only (pip install . — no extras) for a
# ~200MB / 64-package venv.
model_catalog:
  enabled: false             # no manifest fetch; in-repo fallback data is used
updates:
  check_on_startup: false    # no git ls-remote / PyPI attempt at launch
lsp:
  enabled: false             # no on-demand language-server downloads
security:
  tirith_enabled: false      # no external scanner binary probing
stt:
  enabled: false             # no local whisper model load either (RAM)
